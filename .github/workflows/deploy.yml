.code-block pre{margin:0;white-space:pre-wrap;word-break:break-all}
.copy-btn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.08);border:none;color:#a5b4fc;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer;transition:.2s}
.copy-btn:hover{background:rgba(102,126,234,.25);color:#fff}
.btn{display:block;width:100%;text-align:center;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-decoration:none;padding:14px;border-radius:10px;font-weight:600;margin-bottom:10px;transition:.2s;border:none;cursor:pointer;font-size:.95rem}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(102,126,234,.3)}
.btn-secondary{background:linear-gradient(135deg,#11998e,#38ef7d)}
.btn-secondary:hover{box-shadow:0 8px 24px rgba(17,153,142,.3)}
.btn-danger{background:linear-gradient(135deg,#eb3349,#f45c43)}
.steps{margin:0;padding-left:20px}
.steps li{margin-bottom:10px;color:#b0b3c7;font-size:.9rem}
.steps li strong{color:#e8e8f0}
.warning{background:rgba(245,158,11,.08);border-left:3px solid #f59e0b;padding:16px;border-radius:0 10px 10px 0;margin:20px 0;font-size:.85rem;color:#d4d4d8}
.warning strong{color:#fbbf24}
footer{text-align:center;margin-top:40px;color:#4b5563;font-size:.75rem}
.device-info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.info-item{background:rgba(255,255,255,.02);padding:10px 14px;border-radius:8px;font-size:.82rem}
.info-item span{display:block;color:#6b7280;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.info-item code{color:#a5b4fc;font-family:monospace}
</style>
</head>
<body>
<div class="container">
<header>
<div class="badge">GhostLock + KernelSU</div>
<h1>🔓 <span id="devName">Loading...</span></h1>
<p class="subtitle">一键越狱模式 · late-load KernelSU</p>
</header>

<div class="card">
<h2>📱 设备信息</h2>
<div class="device-info">
<div class="info-item"><span>设备代号</span><code id="dCode">-</code></div>
<div class="info-item"><span>Payload</span><code>preload.so</code></div>
<div class="info-item"><span>模式</span><code>KernelSU late-load</code></div>
<div class="info-item"><span>SHA256</span><code id="dHash">-</code></div>
</div>
