name: Boot.img → GhostLock KernelSU Jailbreak → GitHub Pages

on:
  workflow_dispatch:
    inputs:
      bootimg_url:
        description: 'Boot.img direct download URL'
        required: true
      xbl_config_url:
        description: 'xbl_config.img URL (optional, for better offset accuracy)'
        required: false
        default: ''
      vendor_boot_url:
        description: 'vendor_boot.img URL (optional, for MTK or GKI2 devices)'
        required: false
        default: ''
      kernel_base:
        description: 'Kernel base address hex (optional, auto-detect if empty)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu p7zip-full curl file jq
          pip install vmlinux-to-elf pyelftools

      - name: Download images
        run: |
          mkdir -p images
          curl -fsSL --retry 3 --retry-delay 5 -o images/boot.img "${{ github.event.inputs.bootimg_url }}"
          ls -la images/boot.img
          file images/boot.img
          if [ -n "${{ github.event.inputs.xbl_config_url }}" ]; then
            curl -fsSL --retry 3 -o images/xbl_config.img "${{ github.event.inputs.xbl_config_url }}"
          fi
          if [ -n "${{ github.event.inputs.vendor_boot_url }}" ]; then
            curl -fsSL --retry 3 -o images/vendor_boot.img "${{ github.event.inputs.vendor_boot_url }}"
          fi

      - name: Auto-detect device name
        id: detect
        run: |
          # Method 1: strings grep ro.product.device
          DEVICE=$(strings images/boot.img 2>/dev/null | grep -oE 'ro\.product\.device=[^[:space:]]+' | head -n1 | cut -d= -f2)
          if [ -z "$DEVICE" ]; then
            # Method 2: grep ro.build.product
            DEVICE=$(strings images/boot.img 2>/dev/null | grep -oE 'ro\.build\.product=[^[:space:]]+' | head -n1 | cut -d= -f2)
          fi
          if [ -z "$DEVICE" ]; then
            # Method 3: boot.img header name field (16 bytes at offset 0x30)
            DEVICE=$(dd if=images/boot.img bs=1 skip=48 count=16 2>/dev/null | strings | head -n1 | tr -dc 'a-zA-Z0-9_-')
          fi
          if [ -z "$DEVICE" ]; then
            # Method 4: dtb compatible string
            mkdir -p /tmp/dtb_extract
            python3 -c "
import os, struct
with open('images/boot.img','rb') as f:
    hdr = f.read(2048)
    if hdr[:8] == b'ANDROID!':
        ks = struct.unpack('<I', hdr[8:12])[0]
        ps = struct.unpack('<I', hdr[36:40])[0]
        f.seek(ps)
        kernel = f.read(ks)
        with open('/tmp/dtb_extract/k.gz','wb') as o: o.write(kernel)
    else:
        with open('/tmp/dtb_extract/k.gz','wb') as o: o.write(f.read())
" 2>/dev/null || true
            gzip -dc /tmp/dtb_extract/k.gz > /tmp/dtb_extract/kernel_raw 2>/dev/null || true
            if [ -f /tmp/dtb_extract/kernel_raw ]; then
              strings /tmp/dtb_extract/kernel_raw 2>/dev/null | grep -oE 'compatible[[:space:]]*=[[:space:]]*"[^"]+"' | head -n1 | sed 's/.*"\([^,]*\).*/\1/' | tr -dc 'a-zA-Z0-9_-' > /tmp/dtb_extract/dev.txt || true
              DEVICE=$(cat /tmp/dtb_extract/dev.txt 2>/dev/null)
            fi
          fi
          if [ -z "$DEVICE" ]; then
            DEVICE="unknown-$(sha256sum images/boot.img | cut -c1-8)"
          fi
          DEVICE=$(echo "$DEVICE" | tr '[:upper:]' '[:lower:]' | tr -dc 'a-z0-9_-')
          echo "Detected device: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Clone CVE-2026-43499-root-KernelSU
        run: |
          git clone --depth 1 https://github.com/woshimaniubi8/CVE-2026-43499-root-KernelSU.git jailbreak
          ls jailbreak/
          ls -la jailbreak/build/embed/ksud 2>/dev/null || echo "[!] ksud blob missing"

      - name: Generate target.h
        run: |
          cd jailbreak
          DEVICE="${{ steps.detect.outputs.device }}"
          mkdir -p "src/targets/$DEVICE"
          pip install -r tools/requirements.txt 2>/dev/null || true
          GEN_CMD="python3 tools/generate_target.py --project $DEVICE --boot ../images/boot.img"
          if [ -f "../images/xbl_config.img" ]; then
            GEN_CMD="$GEN_CMD --xbl-config ../images/xbl_config.img"
          fi
          if [ -f "../images/vendor_boot.img" ]; then
            GEN_CMD="$GEN_CMD --mtk-vendor-boot ../images/vendor_boot.img"
          fi
          if [ -n "${{ github.event.inputs.kernel_base }}" ]; then
            GEN_CMD="$GEN_CMD --kernel-base ${{ github.event.inputs.kernel_base }}"
          fi
          echo "Running: $GEN_CMD"
          $GEN_CMD || {
            echo "[!] Fallback to rodin template"
            TARGET_TEMPLATE=rodin $GEN_CMD --template-target rodin
          }
          head -n 30 "src/targets/$DEVICE/target.h" || true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Build preload.so
        env:
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd jailbreak
          DEVICE="${{ steps.detect.outputs.device }}"
          make PROJECT="$DEVICE" -j$(nproc)
          ls -la "build/$DEVICE/bin/preload.so"
          cp "build/$DEVICE/bin/preload.so" ../preload.so
          cp "src/targets/$DEVICE/target.h" ../target.h

      - name: Prepare GitHub Pages
        run: |
          DEVICE="${{ steps.detect.outputs.device }}"
          mkdir -p _site
          cp preload.so "_site/preload-${DEVICE}.so"
          cp target.h "_site/target-${DEVICE}.h"
          SHA=$(sha256sum preload.so | cut -d' ' -f1)
          cat > _site/index.html << 'HTMLEOF'
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔓 GhostLock KernelSU</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e8e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;min-height:100vh;line-height:1.6}
.container{max-width:720px;margin:0 auto;padding:40px 20px}
header{text-align:center;margin-bottom:40px}
.badge{display:inline-block;background:rgba(102,126,234,.15);color:#a5b4fc;border:1px solid rgba(102,126,234,.3);padding:4px 14px;border-radius:20px;font-size:.8rem;margin-bottom:12px}
h1{font-size:2.2rem;background:linear-gradient(90deg,#667eea,#764ba2,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
