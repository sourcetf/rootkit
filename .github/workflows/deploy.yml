name: GhostLock KernelSU Builder

on:
  workflow_dispatch:
    inputs:
      bootimg_url:
        description: 'Boot.img direct download URL'
        required: true
      xbl_config_url:
        description: 'xbl_config.img URL (optional)'
        required: false
        default: ''
      vendor_boot_url:
        description: 'vendor_boot.img URL (optional, for MTK/GKI2)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu curl file
          pip install vmlinux-to-elf pyelftools 2>/dev/null || true

      - name: Download images
        run: |
          mkdir -p images
          curl -fsSL --retry 3 --retry-delay 5 -o images/boot.img "${{ github.event.inputs.bootimg_url }}"
          [ -n "${{ github.event.inputs.xbl_config_url }}" ] && curl -fsSL --retry 3 -o images/xbl_config.img "${{ github.event.inputs.xbl_config_url }}"
          [ -n "${{ github.event.inputs.vendor_boot_url }}" ] && curl -fsSL --retry 3 -o images/vendor_boot.img "${{ github.event.inputs.vendor_boot_url }}"

      - name: Detect device name
        id: detect
        run: bash scripts/detect-device.sh images/boot.img

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Clone source and build
        env:
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash scripts/build.sh "${{ steps.detect.outputs.device }}"

      - name: Generate GitHub Pages site
        run: bash scripts/generate-site.sh "${{ steps.detect.outputs.device }}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
