adb shell 'KSUD_PACKAGE=com.example.manager LD_PRELOAD=/data/local/tmp/preload.so /system/bin/toybox id'

# 跳过 ksud 写出
adb shell 'KSUD_SKIP_WRITE=1 LD_PRELOAD=/data/local/tmp/preload.so /system/bin/toybox id'

# 查看日志
adb shell 'cat /data/local/tmp/ksud.log /data/local/tmp/ksud.preload.log'</pre>
</div>
<a class="btn btn-danger" id="dlH" href="#" download>⬇️ 下载 target.h（调试用）</a>
</div>

<footer>
<p>基于 <a href="https://github.com/woshimaniubi8/CVE-2026-43499-root-KernelSU" style="color:#667eea">CVE-2026-43499-root-KernelSU</a></p>
<p style="margin-top:4px">仅供安全研究与学习用途</p>
</footer>
</div>
<script>
const d=new URLSearchParams(location.search).get('device')||'unknown';
const hash=location.hash.slice(1)||'';
document.getElementById('devName').textContent=d;
document.getElementById('dCode').textContent=d;
document.getElementById('dHash').textContent=hash?hash.slice(0,16)+'...':'-';
document.getElementById('dlSo').href='preload-'+d+'.so';
document.getElementById('dlSo').download='preload-'+d+'.so';
document.getElementById('dlH').href='target-'+d+'.h';
document.getElementById('dlH').download='target-'+d+'.h';
function copy(btn){
  const pre=btn.parentElement.querySelector('pre');
  navigator.clipboard.writeText(pre.innerText).then(()=>{btn.textContent='已复制';setTimeout(()=>btn.textContent='复制',1500)});
}
</script>
