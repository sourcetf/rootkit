<div class="card">
<h2>⚡ 一键越狱</h2>
<p style="color:#b0b3c7;font-size:.85rem;margin-bottom:14px">在已开启 USB 调试的设备上执行：</p>
<div class="code-block">
<button class="copy-btn" onclick="copy(this)">复制</button>
<pre id="cmd">adb push preload.so /data/local/tmp/preload.so
adb shell 'chmod 755 /data/local/tmp/preload.so'
adb shell 'LD_PRELOAD=/data/local/tmp/preload.so /system/bin/toybox id'</pre>
</div>
<a class="btn" id="dlSo" href="#" download>⬇️ 下载 preload.so</a>
<a class="btn btn-secondary" href="https://github.com/tiann/KernelSU/releases" target="_blank">📥 下载 KernelSU 管理器</a>
</div>

<div class="card">
<h2>📋 使用步骤</h2>
<ol class="steps">
<li><strong>安装 KernelSU 管理器 APK</strong>（无需提前 root）</li>
<li><strong>开启 USB 调试</strong>，连接电脑</li>
<li><strong>执行上方 adb 命令</strong>，等待利用完成</li>
<li>成功后打开 KernelSU 管理器，授予 root 权限</li>
<li>享受 root 环境（无需解锁 Bootloader）</li>
</ol>
<div class="warning">
<strong>⚠️ 风险提示</strong><br>
利用失败会导致 kernel panic → 自动重启，不会损坏设备。偏移由自动化脚本提取，可能存在误差。建议在备用机上测试。仅供安全研究，使用者自行承担风险。
</div>
</div>

<div class="card">
