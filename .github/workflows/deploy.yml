          sed -i "s|Loading...|$DEVICE|g" _site/index.html
          sed -i "s|-|$(echo $SHA | cut -c1-16)...|g" _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
